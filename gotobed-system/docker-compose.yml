version: '3.8'
services:
  gotobed:
    image: ${GOTOBED_IMAGE:-gotobed-system:amd64}
    build:
      context: ..
      dockerfile: gotobed-system/Dockerfile
    container_name: gotobed-system
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ${GOTOBED_DATA_DIR:-./data}:/app/data
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
