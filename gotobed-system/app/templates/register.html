{% extends "base.html" %}
{% block title %}注册 - 查寝管理系统{% endblock %}
{% block fullpage %}
<div class="login-wrapper"><div class="login-card">
    <h2>注册账号</h2><p class="login-sub">使用邮箱验证后创建账号</p>
    <form method="POST">
        <div class="auth-code-row"><input type="email" class="form-control" name="email" placeholder="邮箱地址" required><button class="btn btn-ghost" type="submit" formaction="{{ url_for('auth.register_send_code') }}" formmethod="POST" formnovalidate>发送验证码</button></div>
        <input class="form-control auth-input" name="code" placeholder="6 位验证码" inputmode="numeric" maxlength="6" required>
        <input type="password" class="form-control auth-input" name="password" placeholder="设置密码（至少 8 位）" minlength="8" required>
        <input type="password" class="form-control auth-input" name="confirm_password" placeholder="确认密码" minlength="8" required>
        <button type="submit" class="btn btn-accent btn-full">完成注册</button>
    </form>
    <div class="auth-links"><a href="{{ url_for('auth.login') }}">返回登录</a></div>
</div></div>
{% endblock %}
