{% extends "base.html" %}
{% block title %}注册 - 查寝管理系统{% endblock %}
{% block fullpage %}
<main class="auth-layout">
    <section class="auth-intro"><a class="auth-brand" href="{{ url_for('auth.login') }}"><span class="brand-mark">✦</span>查寝管理系统</a><div class="auth-intro-copy"><p class="auth-kicker">CREATE ACCOUNT</p><h1>从一个邮箱<br>开始管理。</h1><p>验证邮箱后即可创建账号，个人任务与执行日志彼此隔离。</p></div></section>
    <section class="auth-panel"><div class="auth-form-wrap">
        <div class="auth-heading"><p class="eyebrow">创建新账号</p><h2>注册</h2><p>请使用常用邮箱完成验证。</p></div>
        <form method="POST" class="stack-form" id="register-form">
            <div class="field"><label for="email">邮箱地址</label><input type="email" class="form-control" id="email" name="email" autocomplete="email" required autofocus placeholder="name@example.com"></div>
            <div class="field"><label for="code">邮箱验证码</label><div class="input-action"><input class="form-control" id="code" name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required placeholder="6 位验证码"><button class="btn btn-ghost" type="button" id="send-code">发送验证码</button></div><p class="form-help" id="code-hint">验证码有效期 10 分钟</p></div>
            <div class="field"><label for="password">设置密码</label><input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="8" required placeholder="至少 8 位字符"><p class="form-help">密码至少 8 位</p></div>
            <div class="field"><label for="confirm_password">确认密码</label><input type="password" class="form-control" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required placeholder="再次输入密码"></div>
            <button type="submit" class="btn btn-accent btn-full">创建账号</button>
        </form>
        <div class="auth-links single"><a href="{{ url_for('auth.login') }}">已有账号？返回登录</a></div>
    </div></section>
</main>
{% endblock %}
{% block scripts %}<script>
(function () {
    var button = document.getElementById('send-code');
    if (!button) return;
    var emailInput = document.getElementById('email');
    var hint = document.getElementById('code-hint');
    var key = 'gotobed-register-code-until';
    function startCooldown() {
        var left = Math.max(0, Math.ceil((Number(localStorage.getItem(key) || 0) - Date.now()) / 1000));
        if (!left) { button.disabled = false; button.textContent = '发送验证码'; return; }
        button.disabled = true;
        button.textContent = left + ' 秒后重试';
        var timer = setInterval(function () {
            left -= 1;
            button.textContent = left > 0 ? left + ' 秒后重试' : '发送验证码';
            if (left <= 0) { clearInterval(timer); button.disabled = false; localStorage.removeItem(key); }
        }, 1000);
    }
    startCooldown();
    button.addEventListener('click', async function () {
        if (button.disabled) return;
        if (!emailInput.checkValidity()) { emailInput.reportValidity(); return; }
        button.disabled = true;
        button.textContent = '发送中…';
        hint.textContent = '正在发送验证码…';
        hint.classList.remove('form-success', 'form-error');
        try {
            var response = await fetch('{{ url_for("auth.register_send_code") }}', {
                method: 'POST',
                headers: { 'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json' },
                body: new URLSearchParams({ email: emailInput.value })
            });
            var data = await response.json();
            hint.textContent = data.message;
            hint.classList.add(data.ok ? 'form-success' : 'form-error');
            if (data.ok) {
                // 只刷新验证码按钮状态，不刷新页面，其他输入内容会完整保留。
                localStorage.setItem(key, String(Date.now() + 60000));
                startCooldown();
            } else {
                button.disabled = false;
                button.textContent = '发送验证码';
            }
        } catch (error) {
            hint.textContent = '请求失败，请检查网络后重试';
            hint.classList.add('form-error');
            button.disabled = false;
            button.textContent = '发送验证码';
        }
    });
}());
</script>{% endblock %}
