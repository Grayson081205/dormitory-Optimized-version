{% extends "base.html" %}
{% block title %}找回密码 - 查寝管理系统{% endblock %}
{% block fullpage %}
<div class="login-wrapper"><div class="login-card">
    <h2>找回密码</h2><p class="login-sub">验证码将发送到你的注册邮箱</p>
    <form method="POST"><input type="email" class="form-control auth-input" name="email" placeholder="注册邮箱" required><button class="btn btn-accent btn-full">发送验证码</button></form>
    <div class="auth-links"><a href="{{ url_for('auth.login') }}">返回登录</a></div>
</div></div>
{% endblock %}
