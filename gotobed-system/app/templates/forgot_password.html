{% extends "base.html" %}
{% block title %}找回密码 - 查寝管理系统{% endblock %}
{% block fullpage %}
<main class="auth-layout"><section class="auth-intro"><a class="auth-brand" href="{{ url_for('auth.login') }}"><span class="brand-mark">✦</span>查寝管理系统</a><div class="auth-intro-copy"><p class="auth-kicker">ACCOUNT RECOVERY</p><h1>重新找回<br>你的访问权限。</h1><p>通过注册邮箱接收验证码，几步即可设置新密码。</p></div></section><section class="auth-panel"><div class="auth-form-wrap"><div class="auth-heading"><p class="eyebrow">账户恢复</p><h2>找回密码</h2><p>输入注册邮箱，我们会发送验证码。</p></div><form method="POST" class="stack-form"><div class="field"><label for="email">注册邮箱</label><input type="email" class="form-control" id="email" name="email" autocomplete="email" required autofocus placeholder="name@example.com"></div><button type="submit" class="btn btn-accent btn-full">发送验证码</button></form><div class="auth-links single"><a href="{{ url_for('auth.login') }}">返回登录</a></div></div></section></main>
{% endblock %}
