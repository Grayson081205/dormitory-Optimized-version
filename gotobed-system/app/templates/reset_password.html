{% extends "base.html" %}
{% block title %}重置密码 - 查寝管理系统{% endblock %}
{% block fullpage %}
<div class="login-wrapper"><div class="login-card">
    <h2>重置密码</h2><p class="login-sub">邮箱：{{ email }}</p>
    <form method="POST"><input type="hidden" name="email" value="{{ email }}"><input class="form-control auth-input" name="code" placeholder="6 位验证码" inputmode="numeric" maxlength="6" required><input type="password" class="form-control auth-input" name="password" placeholder="新密码（至少 8 位）" minlength="8" required><input type="password" class="form-control auth-input" name="confirm_password" placeholder="确认新密码" minlength="8" required><button class="btn btn-accent btn-full">保存新密码</button></form>
    <div class="auth-links"><a href="{{ url_for('auth.login') }}">返回登录</a></div>
</div></div>
{% endblock %}
