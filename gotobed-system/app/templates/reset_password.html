{% extends "base.html" %}
{% block title %}重置密码 - 查寝管理系统{% endblock %}
{% block fullpage %}
<main class="auth-layout"><section class="auth-intro"><a class="auth-brand" href="{{ url_for('auth.login') }}"><span class="brand-mark">✦</span>查寝管理系统</a><div class="auth-intro-copy"><p class="auth-kicker">NEW PASSWORD</p><h1>设置一个<br>全新的密码。</h1><p>完成验证后，新密码会立即生效。</p></div></section><section class="auth-panel"><div class="auth-form-wrap"><div class="auth-heading"><p class="eyebrow">账户恢复</p><h2>重置密码</h2><p>验证码已发送至 <strong class="inline-emphasis">{{ email }}</strong></p></div><form method="POST" class="stack-form"><input type="hidden" name="email" value="{{ email }}"><div class="field"><label for="code">邮箱验证码</label><input class="form-control" id="code" name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required placeholder="6 位验证码"></div><div class="field"><label for="password">新密码</label><input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="8" required placeholder="至少 8 位字符"></div><div class="field"><label for="confirm_password">确认新密码</label><input type="password" class="form-control" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required placeholder="再次输入密码"></div><button type="submit" class="btn btn-accent btn-full">保存新密码</button></form><div class="auth-links single"><a href="{{ url_for('auth.login') }}">返回登录</a></div></div></section></main>
{% endblock %}
